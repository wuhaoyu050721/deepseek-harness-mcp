# 复制到 config/*.local.toml 后按本机绝对路径修改。不要填明文密钥。
data_dir = "../data/codex"
# Windows desktop 的新任务默认修改独立副本；旧配置未设置此字段时仍默认 review。
default_mode = "edit"

[completion]
# 任务完成后由可信宿主上下文通知原 Codex 对话继续处理。
auto_continue = true

[model]
provider = "deepseek-official"
model = "deepseek-flash"
base_url = "https://api.deepseek.com/anthropic"
credential_source = "desktop_store"
credential_env = "DEEPSEEK_API_KEY"

[executor]
# 使用本机桌面安装自带 runtime；空安装路径表示自动检测。
backend = "desktop"
desktop_root = ""
# 以下资源和租约设置仅用于可选的 docker backend。
image = "deepseek-harness-worker:0.1.0"
cpus = 1.0
memory_mb = 1024
pids_limit = 128
lease_seconds = 15
heartbeat_seconds = 2
termination_grace_seconds = 3

[limits]
max_parallel_jobs = 3
max_queue = 5
default_timeout_seconds = 600
max_timeout_seconds = 1800
max_file_bytes = 2097152
max_snapshot_bytes = 104857600
max_output_bytes = 1048576

[projects.sample]
path = "C:/absolute/path/to/an/authorized/git/project"
allowed_paths = ["src", "README.md"]
exclude_patterns = []
allow_untracked = []
# 本机授权修改该项目的任务副本；主 AI 复核差异后才合入原项目。
allow_edits = true
